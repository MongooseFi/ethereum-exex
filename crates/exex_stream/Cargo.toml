[package]
name = "exex-stream"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Wire format, Unix-socket server and client for the node's thin ExEx stream"

# Keep explicit versions: Services consumes this crate by pinned Git revision
# without depending on the Reth node workspace.
[dependencies]
alloy-primitives = { version = "1.6.0", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "1.0"
tokio = { version = "1.42", features = ["net", "io-util", "sync", "time", "rt", "macros"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.42", features = ["full"] }
